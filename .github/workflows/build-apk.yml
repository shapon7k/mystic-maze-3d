name: Build Android Debug APK

# Manual only: run it from GitHub -> Actions -> "Build Android Debug APK" -> Run workflow.
# (Pushes no longer trigger a build.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run game tests
        run: npm test
        continue-on-error: true

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into the Android project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mystic-maze-3d-debug.apk
          gh release create "apk-${{ github.run_number }}" mystic-maze-3d-debug.apk \
            --title "Mystic Maze 3D debug APK #${{ github.run_number }}" \
            --notes "Debug build from commit ${{ github.sha }}" \
            --prerelease

      - name: Upload APK artifact (optional, may fail if storage quota is full)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mystic-maze-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
